<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>Javascript</title>
    </head>
    <body>
        <h1>My Javascript</h1>
        <button onclick="showmessage()">
            Clickkk
        </button>
        <p id="message"></p>
        <script>
            function showmessage(){
                document.getElementsById("message").textcontent = "javaScript is working.";
            }
        </script>
        <label for="age">Enter your age:</label>
        <input id="age"  type="number">
        <button offclick="checkAge()">Check</button>
        <p id="answer"></p>

        <script>
            function checkAge(){
                const age = Number(document.getElementById("age").Value);
                if (age>=18){
                    document.getElementsById("answer").textcontent =age
                    "you can move on.";
                } else {
                    document.getElementsById("answer").textcontent =age
                    "cant go."
                }
            }
        </script>
    </body>
</html>
